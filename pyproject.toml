[project]
name = "skillgrep"
version = "0.2.0"
description = "Search local Agent Skill collections without loading them all."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lev Vereshchagin", email = "main@vrslev.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
skillgrep = "skillgrep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1",
]

[build-system]
requires = ["uv-build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--cov=skillgrep --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
